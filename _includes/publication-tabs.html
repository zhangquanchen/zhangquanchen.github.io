<style>
.publication-tabs {
  display: flex;
  align-items: stretch;
  gap: clamp(18px, 3.5vw, 36px);
  margin: 18px 0 12px;
  border-bottom: 1px solid #e4e7eb;
}
.publication-tabs [role="tab"] {
  position: relative;
  flex: 0 0 auto;
  min-height: 48px;
  margin: 0 0 -1px;
  padding: 10px 0 14px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: #707780;
  font: inherit;
  font-size: 0.95em;
  font-weight: 600;
  line-height: 1.4;
  text-align: left;
  cursor: pointer;
  transition: color 160ms ease;
}
.publication-tabs [role="tab"]::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  border-radius: 2px 2px 0 0;
  background: #1675b6;
  transform: scaleX(0);
  transition: transform 160ms ease;
}
.publication-tabs [role="tab"]:hover {
  color: #1675b6;
}
.publication-tabs [aria-selected="true"] {
  color: #182b3a;
}
.publication-tabs [aria-selected="true"]::after {
  transform: scaleX(1);
}
.publication-tabs [role="tab"]:focus-visible,
.publication-panel:focus-visible {
  outline: 2px solid #1675b6;
  outline-offset: 4px;
}
.publication-panel[hidden] {
  display: none !important;
}
@media (max-width: 600px) {
  .publication-tabs {
    gap: 16px;
  }
  .publication-tabs [role="tab"] {
    flex: 1 1 0;
    min-width: 0;
    padding: 10px 0 12px;
    font-size: 0.8em;
  }
}
@media (prefers-reduced-motion: reduce) {
  .publication-tabs [role="tab"],
  .publication-tabs [role="tab"]::after {
    transition: none;
  }
}
</style>
<script>
(function () {
  var tablist = document.querySelector('.publication-tabs');
  if (!tablist) return;
  var tabs = Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]'));
  var panels = tabs.map(function (tab) {
    return document.getElementById(tab.getAttribute('aria-controls'));
  });

  function selectTab(index, focus) {
    tabs.forEach(function (tab, i) {
      tab.setAttribute('aria-selected', String(i === index));
      tab.tabIndex = i === index ? 0 : -1;
      panels[i].hidden = i !== index;
    });
    if (focus) tabs[index].focus();
  }

  tabs.forEach(function (tab, index) {
    tab.addEventListener('click', function () { selectTab(index, false); });
    tab.addEventListener('keydown', function (event) {
      var next;
      if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
      else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = tabs.length - 1;
      else return;
      event.preventDefault();
      selectTab(next, true);
    });
  });

  // Reveal the right category when opening a paper from a news or shared link.
  function revealLinkedPaper() {
    var id;
    try { id = decodeURIComponent(window.location.hash.slice(1)); }
    catch (error) { return; }
    var target = document.getElementById(id);
    if (!target) return;
    var panel = target.closest('.publication-panel');
    var index = panels.indexOf(panel);
    if (index === -1) return;
    selectTab(index, false);
    target.scrollIntoView({ block: 'start' });
  }

  selectTab(0, false);
  revealLinkedPaper();
  window.addEventListener('hashchange', revealLinkedPaper);
}());
</script>
