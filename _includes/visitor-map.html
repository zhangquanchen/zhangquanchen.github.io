{% if site.mapmyvisitors_id %}
<div class="visitor-map-section" style="margin-top: 1.25em; padding-top: 1.25em; border-top: 1px solid #dee2e6;">
  <p style="font-size: 0.9em; color: #555; margin: 0 0 0.75em; line-height: 1.4;">
    Recent visitors by region (world map). Dots show approximate geographic distribution.
  </p>
  <div class="visitor-map-container" style="max-width: 640px; margin: 0 auto; text-align: center; overflow-x: auto; min-height: 360px;">
    <script type="text/javascript" id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?d={{ site.mapmyvisitors_id }}&cl=ffffff&w=a"></script>
  </div>
</div>
{% endif %}
